name: Voice Hub
version: "0.10.1"
slug: voice_hub
description: Tells Home Assistant who is speaking to your voice satellites, without changing your pipelines
url: https://github.com/ale1800/voice-hub
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:account-voice
panel_title: Voice Hub
ports:
  10310/tcp: 10310
  10400/tcp: 10400
ports_description:
  10310/tcp: Optional Wyoming speech-to-text pass-through (only with "wyoming" on)
  10400/tcp: Second-stage wake word and conversation agent (Wyoming)
map:
  - share:rw
options:
  capture: true
  wyoming: false
  wake: true
  wake_threshold: 0.1
  save_rejected: true
  agent: true
  stt_entity: stt.home_assistant_cloud
  language: ""
  collect: false
  threshold: 0.35
  margin: 0.1
  min_duration: 0.8
  threads: 2
  debug: false
schema:
  capture: bool
  wyoming: bool
  wake: bool
  wake_threshold: float(0.01,0.99)
  save_rejected: bool
  agent: bool?
  stt_entity: str
  language: str?
  collect: bool
  threshold: float(0,1)
  margin: float(0,1)
  min_duration: float(0,10)
  threads: int(1,8)
  debug: bool
